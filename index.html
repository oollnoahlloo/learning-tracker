async function readHWP(buf){const d=new Uint8Array(buf),v=new DataView(buf);

 const chain=(s,t)=>{const o=[];while(s<0xFFFFFFFA&&s<t.length&&o.length<1e6){o.push(s);s=t[s]}return o};
 const cat=a=>{let n=0;a.forEach(x=>n+=x.length);const r=new Uint8Array(n);let p=0;a.forEach(x=>{r.set(x,p);p+=x.length});return r};

 const dir=rs(ds),ents=[];
 for(let i=0;i<dir.length/128;i++){const o=i*128,dv=new DataView(dir.buffer,dir.byteOffset+o,128),nl=dv.getUint16(64,true);let nm='';

 chain(mfs,fat).forEach(i=>{const o=512+i*ss;for(let k=0;k<ss/4;k++)mf.push(u32(o+k*4))});

async function onFile(el){const f=el.files[0];if(!f)return;uerr='';up=null;
 try{const L=await readHWP(await f.arrayBuffer());mkUp(f.name,L,+(f.name.match(/20\d\d/)||[new Date().getFullYear()])[0])}catch(e){uerr='읽지 못했어요: '+e.message}render()}
const reYear=v=>{uerr='';try{mkUp(up.name,up.L,+v)}catch(e){uerr=e.message}render()};
function applyUp(){st.plan=up.plan;st.planName=up.name;st.pg={};delete st.end;PLAN=st.plan;NAMES=Object.keys(PLAN.subjects);up=null;note='새 진도표를 적용했어요. 시간표와 전담 설정은 그대로예요.';save();render()}
const resetPlan=()=>{delete st.plan;delete st.planName;st.pg={};delete st.end;PLAN=DEFAULT;NAMES=Object.keys(PLAN.subjects);save();render()};
const setEnd=v=>{v?st.end=v:delete st.end;save();render()};
const toggle=()=>{open=!open;note='';uerr='';render()};
const go=n=>{const d=dt(cur);d.setDate(d.getDate()+n);cur=iso(d);render()};
const setDate=v=>{cur=v||iso(new Date());render()};
const savePg=(n,v)=>{if(v)st.pg[n]=+v;else delete st.pg[n];st.pgd=st.pgd||{};st.pgd[n]=iso(new Date());save()};
const setPg=(n,v)=>{savePg(n,v);render()};
function fit(){document.querySelectorAll('.fit').forEach(el=>{el.style.fontSize='';let s=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth+1&&s>11){s-=.5;el.style.fontSize=s+'px'}})}
addEventListener('resize',fit);
const hide=(n,c)=>{st.hide[n]=c;save();render()};
const setTT=(d,p,v)=>{st.tt[d]=st.tt[d]||[];st.tt[d][p]=v;note='';save();render()};
const setOv=(i,v)=>{if(!st.ovr[cur])st.ovr[cur]=eff(cur);st.ovr[cur][i]=v;save();render()};
render();
</script></body></html>
